name: CD Signal Processing Service

on:
  workflow_run:
    workflows: ["CI Signal Processing Service"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Acquire exclusive deploy lock (avoid overwhelming the shared host)
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          MAX_WAIT=2400
          MAX_LOCK_AGE=1800
          waited=0
          while ! mkdir "$LOCK_DIR" 2>/dev/null; do
            lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_DIR" 2>/dev/null || date +%s) ))
            if [ "$lock_age" -gt "$MAX_LOCK_AGE" ]; then
              echo "Lock abandonado hace ${lock_age}s (el dueno probablemente murio) -- liberando y tomando control"
              rm -rf "$LOCK_DIR"
              continue
            fi
            if [ "$waited" -ge "$MAX_WAIT" ]; then
              echo "Timeout esperando el lock de deploy compartido"
              exit 1
            fi
            echo "Otro deploy de MeTradingPlat esta en curso, esperando... (${waited}s/${MAX_WAIT}s)"
            sleep 10
            waited=$((waited + 10))
          done
          echo "${{ github.repository }}" > "$LOCK_DIR/owner"
          echo "Lock de deploy adquirido"

      - name: Create Docker Network
        run: |
          docker network create metradingplat-network || echo "Network already exists"

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h
          echo "--- CLEANING SERVICE METADATA ---"
          docker rm -f signal-processing-service || true
          docker image rm -f virtud142/metradingplat_signal_processing_service:latest || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          for i in 1 2 3 4 5; do
            docker pull virtud142/metradingplat_signal_processing_service:latest && exit 0 || \
            (echo "Attempt $i failed, waiting $((i * 15))s..." && sleep $((i * 15)))
          done
          echo "All pull attempts failed. Docker daemon might need a manual restart."
          exit 1

      - name: Run Application Container
        run: |
          docker run -d \
            --name "signal-processing-service" \
            --network "metradingplat-network" \
            --restart "unless-stopped" \
            --memory "1536m" \
            --memory-swap "1536m" \
            --label project="metradingplat" \
            --label service="signal-processing-service" \
            -e SP_SCANNER_MANAGEMENT_URL="http://scanner-management-service:8081" \
            -e SP_MARKETDATA_URL="http://marketdata-service:8082" \
            -e SP_KAFKA_BOOTSTRAP_SERVERS="kafka:29092" \
            -e SP_KAFKA_GROUP_ID="signal-processing-group" \
            -e SP_MAX_WORKERS_POOL="2" \
            -e SP_MAX_BARRAS_POR_SIMBOLO="500" \
            -e SP_MARGEN_CIERRE_VELA_SEG="5" \
            virtud142/metradingplat_signal_processing_service:latest

      - name: Clean Old Images of This Service
        run: |
          docker images virtud142/metradingplat_signal_processing_service --format "{{.ID}} {{.Tag}}" \
            | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          docker ps -a \
            --filter "label=service=signal-processing-service" \
            --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep signal-processing-service
          echo "--- LAST 20 LINES OF LOGS ---"
          docker logs --tail 20 signal-processing-service

      - name: Release exclusive deploy lock
        if: always()
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          if [ -f "$LOCK_DIR/owner" ] && [ "$(cat "$LOCK_DIR/owner")" = "${{ github.repository }}" ]; then
            rm -rf "$LOCK_DIR"
          fi
